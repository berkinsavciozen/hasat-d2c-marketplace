project_id = "efuqpiaavrzimvstpdpm"

[functions.send-sms]
verify_jwt = true

# Server-to-server only. The platform JWT gate is intentionally disabled because the database
# signs the raw body with NOTIFY_ADMIN_INGRESS_SECRET; notify-admin verifies that HMAC and a
# five-minute timestamp before any database claim or Twilio call. Browser/mobile callers do not
# possess this secret and receive 401/403 from the handler.
[functions.notify-admin]
verify_jwt = false

[functions.whatsapp-ai-webhook]
verify_jwt = false

[functions.ai-chat-stream]
verify_jwt = true

[functions.ai-box-insights]
verify_jwt = true

[functions.admin-kpi]
verify_jwt = false

[functions.recipe-stage-image]
static_files = [ "./functions/_shared/recipe-automation/image/vendor/*" ]

[functions.legacy-recipe-image-backfill]
verify_jwt = false

[functions.extract-recipe]
verify_jwt = true

# T7a is user-only. Keep the platform JWT gate enabled; the handler then binds owner_id to the
# validated token subject and forces visibility=private/status=draft.
[functions.estimate-recipe-from-photo]
verify_jwt = true

[functions.send-push]
verify_jwt = true

[functions.mobile-handoff-issue]
verify_jwt = true

[functions.mobile-handoff-exchange]
verify_jwt = false

[functions.sync-istanbul-hal-prices]
verify_jwt = false

# Admin panel only. Gated by the shared `x-admin-key` / ADMIN_DASHBOARD_KEY check in the handler
# (same as every admin-recipe-* function), not by a platform JWT.
[functions.admin-recipe-regenerate-cover]
verify_jwt = false
